<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Sécurisé | Outil Décodeur MS-PHARM</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Base Styling -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.12) 0%, var(--bg-main) 70%);
      padding: 24px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-lock-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 20px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.2);
    }

    [data-theme="dark"] .auth-lock-icon {
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
    }

    .auth-input-group {
      margin: 24px 0 16px;
      position: relative;
    }

    .auth-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-card-subtle);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: all var(--transition-fast);
    }

    .auth-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }

    /* Decoder Tool Interface (Hidden by default) */
    #decoderTool {
      display: none;
      width: 100%;
      max-width: 520px;
    }

    .decoder-output-box {
      background: var(--bg-card-subtle);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px 18px;
      text-align: center;
      margin-top: 20px;
      transition: all var(--transition-fast);
    }

    .decoder-output-box.has-result {
      background: rgba(16, 185, 129, 0.08);
      border: 2px solid var(--accent);
    }

    .result-placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .result-value {
      font-family: monospace;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 3px;
    }

    .copy-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
      margin-top: 10px;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: white;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 20px;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .back-home:hover {
      color: var(--primary);
    }

    /* Bottom Toast Notification Popup */
    .toast-bottom-popup {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2), 0 4px 10px rgba(0, 0, 0, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 99999;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-bottom-popup.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast-bottom-popup i {
      color: var(--accent);
      font-size: 1.25rem;
    }
  </style>
</head>

<body>

  <!-- ========================================================================
       Password Protection Screen
       ======================================================================== -->
  <div id="lockScreen" class="auth-card">
    <div class="auth-lock-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Accès Restreint</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">
      Veuillez entrer le code d'accès administrateur pour déverrouiller l'outil.
    </p>

    <form onsubmit="event.preventDefault(); checkAuth();">
      <div class="auth-input-group">
        <input type="password" id="secretCodeInput" class="auth-input" placeholder="••••••••" autofocus autocomplete="current-password" />
        <div id="authError" class="error-msg">
          <i class="fa-solid fa-circle-exclamation"></i> Code secret incorrect.
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-key"></i> Déverrouiller l'accès
      </button>
    </form>

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Retour au site principal
    </a>
  </div>

  <!-- ========================================================================
       Unlocked Decoder Tool
       ======================================================================== -->
  <div id="decoderTool">
    <div class="auth-card" style="text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="auth-lock-icon" style="margin: 0; width: 46px; height: 46px; font-size: 1.2rem; background: var(--accent-light); color: var(--accent);">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h2 style="font-size: 1.3rem;">Outil Décodeur</h2>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Moussaoui Services Informatique</span>
          </div>
        </div>
        <button onclick="lockAgain()" class="btn btn-outline btn-sm" title="Verrouiller">
          <i class="fa-solid fa-lock"></i> Verrouiller
        </button>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="inputString" class="form-label" style="margin-bottom: 8px; display: block; font-weight: 700;">
          <i class="fa-solid fa-barcode"></i> Chaîne de référence :
        </label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="inputString" class="auth-input" style="text-align: left; text-transform: uppercase; font-family: monospace; font-size: 1.1rem; font-weight: bold; flex: 1;" placeholder="Ex: PHARM123456" maxlength="24" />
          <button onclick="calculateCode()" class="btn btn-primary">
            <i class="fa-solid fa-calculator"></i> Afficher
          </button>
        </div>
      </div>

      <div class="decoder-output-box" id="outputBox" style="margin-bottom: 20px;">
        <div class="result-placeholder">
          Entrez la chaîne et cliquez sur <strong>Afficher</strong>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-home" style="margin: 0;">
          <i class="fa-solid fa-house"></i> Retour à l'accueil
        </a>
        <button id="copyBtn" class="copy-btn" style="display: none;" onclick="copyResult()">
          <i class="fa-regular fa-copy"></i> Copier le code
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // AES-256-GCM Encrypted Decoder Engine (Protected by password 'msi')
    // ==========================================================================
    const _SALT = Uint8Array.from(atob("bXNwaGFybS1kZWNvZGVyLXNhbHQtMjAyNg=="), c => c.charCodeAt(0));
    const _IV = Uint8Array.from(atob("MTJieXRlc2l2MTIz"), c => c.charCodeAt(0));
    const _CIPHER = Uint8Array.from(atob("jM7QGx3wxxtPevqt6bTpgoJ90U2Rttr5BmFLqIOgGYZOjNdUpV/S+jO2l++8kvdSsSyBoEDQWDqmZJ17+6bmEg7aoAwjLPaTa1VmtfELqkmsMbbtHQzRidEQUwu4Ml6dbLpWVrnp9RPV+dmi9wAroIQEGNxLCfb6fWXA3pjMNld7xv9ra4OISaXMJBN6ZrWFTsAgjl7bXL3OIBO0peixz99ONGSPmysPnUNYr+BEC8C8z7LKqfDCUPwKiVmmklKJ0NDRAii7eRo+lkf5iYOeew0tq5vbBRko+453BGuKOSI2aS/uP4JpBf0rOvkB6KeCLITQmhBIdurdVYAqKbGrLsTounjHvotZ65aR7tYNAbYYnCLa3MmwRjxZHC06+J4aWtJk/Oi0hzZOaJk8qAKHiI4QF1zWL/lRBsRzqMg4VioVY3wCXi3bd1y+fGKlmQj/OQI5Z8H+3bWgR4Ks8SJ0Ot/NM8VeZ2BOe0CsAeMJAfPTrKF4ArpWxaEXinnTggvMh11ElsLNz9uzndZwcKHySLDyvvWn/4D8LYycILFixrGZlMUZTWrR2EJM1+ud2vgYT4VntzoPrKc0iNI33UYkFvc2eLwPdtEnvFRuLl72kZCybJGDHchqmQLA+H0KhZRpKOnF5uSIpamzSjQNetdXnyoojRGkSeI6UsBNp2HrUcxSgXV7RT0a3s8jFOcQweFHroDRuT9s2jAYwXOvUpygBzIvkUdYiyMRB1VoQAeTtDtV4qZK6dY0kRHEqw26ReR+pI3GSh9CQR1ycaoRa0zk842jcctpc9j14Cwr+Sp/5rIdTVQLMy0Az4W6zI/oALPYBPXajk0dToVLP/iXpU8gx3LrM/YiBA828niJPzsuKDi2ywpMq5iz9466TOwG8RhiBaQh18Z2/6jJVB67ZNf59cyTpo4oHEpHGbJ0hrriVGzrXhNaoDQCN3qtdXOAM/N9jt+VxIh8GKoakWdbtoeGajDdABf3P3VOEwjEsOfEDs5KIQUbO1XanWhXjyJaLtkglJQ1r0Vd8IpeA60SNKSj6FNhyBIB1LNp/24NDN+UowdBK8aoPFxzzDaujut1voLx9U9e6Ztsq1L9NhUPtFOaQi3i7XMcW4wN1ndYgo44LmjNtpXrPDk/Y3uSXtIw5JB6TRpw1yAWPwSSPybBHCr6uXu+NFbbVuGIVvdY6IXUjkS5l3+Gy+ZP8iPoqjzS82BA/0TMFmgYeEKFZhdieWc2af7d2IwjY+v/jqlHmlTI3FnPYV6M+BKMi9jWTuUGff4QR516QsbTUaUGQpKMFze7/OU8a09vh5xVvVWNtpEvB3TD4dcGDEUOiVUCiPlMqQsZwGJ50IDnYGtq0OjEOpmBl3Kt1qH8ii6k0nn/+N/FZldSn0ct/R0r0HYE54qhjGeVuDSoaRg/tXonwLx0gi19ZHUm45E9mO09LlKGIkm5gVfS+gFJONs01m+18zL1eIqVMCeQ0Hz2T5NaUvBNEIiErDSuSW7oGo9DA/TkIa64W0mkNOdvKd3NUupdGnuepZvyrvuQ/9Nm6c0AreYKKJpwCdqG27c3LZS62jA3uhj3gpdccqTuNx7xF3y9MvF9smv/P2WRTD+tSkoCBSQ06RxPKzv8S6Svz8w4cff00q4kZrPZX/C46M5dQwd7K8HlTCYG0EgtqboVwg1gqYxISfubeUJ/ma/cDvKdPBJMvfD9XlWjfmaKmVWkWk2ACWrsLDRsB0iIFTbHv+C/4D+NGYO5/fm5UmwqB9IvJpFo3Nf0li0JOgFXhcDvDvh2ym1PpoSuBrCumHlsOpAsbM2vXsFMjd/xi0eOtIdHVc3oDMAskoKAl2PiU+lBYBxYwY5oJi1fpZWOVJFexkCl8uobd14pay4aXQdpefVlSIlcS2gk9gah3ChSvgsvzB01pyeEGST1vXFCbS7f"), c => c.charCodeAt(0));

    let _execDecoder = null;
    let lastResult = "";

    async function decryptAlgorithm(pass) {
      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          enc.encode(pass),
          "PBKDF2",
          false,
          ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: _SALT,
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: _IV },
          key,
          _CIPHER
        );

        const codeStr = new TextDecoder().decode(decrypted);
        return new Function("str", codeStr);
      } catch (e) {
        return null;
      }
    }

    async function checkAuth() {
      const rawInput = document.getElementById("secretCodeInput").value.trim();
      const errorEl = document.getElementById("authError");

      let decoderFn = await decryptAlgorithm(rawInput);
      if (!decoderFn && rawInput.toLowerCase() !== rawInput) {
        decoderFn = await decryptAlgorithm(rawInput.toLowerCase());
      }

      if (decoderFn) {
        _execDecoder = decoderFn;
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("decoderTool").style.display = "block";
        errorEl.style.display = "none";
        document.getElementById("inputString").focus();
      } else {
        errorEl.style.display = "block";
        document.getElementById("secretCodeInput").select();
      }
    }

    function lockAgain() {
      _execDecoder = null;
      document.getElementById("decoderTool").style.display = "none";
      document.getElementById("lockScreen").style.display = "block";
      document.getElementById("secretCodeInput").value = "";
      document.getElementById("secretCodeInput").focus();
    }

    function calculateCode() {
      const outputEl = document.getElementById("outputBox");
      const copyBtn = document.getElementById("copyBtn");
      const inputVal = document.getElementById("inputString").value.trim();

      if (!_execDecoder) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-triangle-exclamation"></i> Session verrouillée.</span>';
        return;
      }

      if (inputVal.length < 8) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> La chaîne doit comporter au moins 8 caractères.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      const res = _execDecoder(inputVal);

      if (!res) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> Format de chaîne invalide.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      lastResult = res;
      outputEl.innerHTML = `
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; display: block; margin-bottom: 4px;">Code Calculé</span>
        <div class="result-value" style="font-size: 1.8rem;">Code is : ${lastResult}</div>
      `;
      outputEl.classList.add("has-result");
      copyBtn.style.display = "inline-flex";
    }

    function showBottomToast(msg) {
      let toast = document.getElementById("bottomToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "bottomToast";
        toast.className = "toast-bottom-popup";
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
      toast.classList.add("show");

      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function fallbackCopy(text, callback) {
      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      tempInput.style.position = "fixed";
      tempInput.style.left = "-9999px";
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        if (callback) callback();
      } catch (err) {
        console.error("Erreur copie :", err);
      }
      document.body.removeChild(tempInput);
    }

    function copyResult() {
      if (!lastResult) return;

      const onCopied = () => {
        showBottomToast(`Code copié : <strong>${lastResult}</strong>`);
        const copyBtn = document.getElementById("copyBtn");
        if (copyBtn) {
          const origHtml = copyBtn.innerHTML;
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copié !';
          copyBtn.style.background = 'var(--accent)';
          copyBtn.style.color = '#fff';
          copyBtn.style.borderColor = 'var(--accent)';
          setTimeout(() => {
            copyBtn.innerHTML = origHtml;
            copyBtn.style.background = '';
            copyBtn.style.color = '';
            copyBtn.style.borderColor = '';
          }, 2000);
        }
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(lastResult).then(onCopied).catch(() => {
          fallbackCopy(lastResult, onCopied);
        });
      } else {
        fallbackCopy(lastResult, onCopied);
      }
    }

    document.getElementById("inputString")?.addEventListener("keypress", (e) => {
      if (e.key === "Enter") calculateCode();
    });
  </script>

</body>
</html>
