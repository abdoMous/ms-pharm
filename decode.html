<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Sécurisé | Outil Décodeur MS-PHARM</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Base Styling -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.12) 0%, var(--bg-main) 70%);
      padding: 24px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-lock-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 20px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.2);
    }

    [data-theme="dark"] .auth-lock-icon {
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
    }

    .auth-input-group {
      margin: 24px 0 16px;
      position: relative;
    }

    .auth-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-card-subtle);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: all var(--transition-fast);
    }

    .auth-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }

    /* Decoder Tool Interface (Hidden by default) */
    #decoderTool {
      display: none;
      width: 100%;
      max-width: 520px;
    }

    .decoder-output-box {
      background: var(--bg-card-subtle);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px 18px;
      text-align: center;
      margin-top: 20px;
      transition: all var(--transition-fast);
    }

    .decoder-output-box.has-result {
      background: rgba(16, 185, 129, 0.08);
      border: 2px solid var(--accent);
    }

    .result-placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .result-value {
      font-family: monospace;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 3px;
    }

    .copy-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
      margin-top: 10px;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: white;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 20px;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>

  <!-- ========================================================================
       Password Protection Screen
       ======================================================================== -->
  <div id="lockScreen" class="auth-card">
    <div class="auth-lock-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Accès Restreint</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">
      Veuillez entrer le code d'accès administrateur pour déverrouiller l'outil.
    </p>

    <form onsubmit="event.preventDefault(); checkAuth();">
      <div class="auth-input-group">
        <input type="password" id="secretCodeInput" class="auth-input" placeholder="••••••••" autofocus autocomplete="current-password" />
        <div id="authError" class="error-msg">
          <i class="fa-solid fa-circle-exclamation"></i> Code secret incorrect.
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-key"></i> Déverrouiller l'accès
      </button>
    </form>

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Retour au site principal
    </a>
  </div>

  <!-- ========================================================================
       Unlocked Decoder Tool
       ======================================================================== -->
  <div id="decoderTool">
    <div class="auth-card" style="text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="auth-lock-icon" style="margin: 0; width: 46px; height: 46px; font-size: 1.2rem; background: var(--accent-light); color: var(--accent);">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h2 style="font-size: 1.3rem;">Outil Décodeur</h2>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Moussaoui Services Informatique</span>
          </div>
        </div>
        <button onclick="lockAgain()" class="btn btn-outline btn-sm" title="Verrouiller">
          <i class="fa-solid fa-lock"></i> Verrouiller
        </button>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="inputString" class="form-label" style="margin-bottom: 8px; display: block; font-weight: 700;">
          <i class="fa-solid fa-barcode"></i> Chaîne de référence :
        </label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="inputString" class="auth-input" style="text-align: left; text-transform: uppercase; font-family: monospace; font-size: 1.1rem; font-weight: bold; flex: 1;" placeholder="Ex: PHARM123456" maxlength="24" />
          <button onclick="calculateCode()" class="btn btn-primary">
            <i class="fa-solid fa-calculator"></i> Afficher
          </button>
        </div>
      </div>

      <div class="decoder-output-box" id="outputBox" style="margin-bottom: 20px;">
        <div class="result-placeholder">
          Entrez la chaîne et cliquez sur <strong>Afficher</strong>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-home" style="margin: 0;">
          <i class="fa-solid fa-house"></i> Retour à l'accueil
        </a>
        <button id="copyBtn" class="copy-btn" style="display: none;" onclick="copyResult()">
          <i class="fa-regular fa-copy"></i> Copier le code
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // AES-256-GCM Encrypted Decoder Engine (Protected by password '123')
    // ==========================================================================
    const _SALT = Uint8Array.from(atob("bXNwaGFybS1kZWNvZGVyLXNhbHQtMjAyNg=="), c => c.charCodeAt(0));
    const _IV = Uint8Array.from(atob("MTJieXRlc2l2MTIz"), c => c.charCodeAt(0));
    const _CIPHER = Uint8Array.from(atob("344dmjiUcZquuThewWBgYfTPxaRDvJwoz92vv+jFVlqtgE99TQNKzRsVvdGTw+fdljRYrja2HuijKHVTrDAkVVWGfEvOGNMCurD8iVtP1Ktv19CizN2aw/gwGalr2zl4Fc24QkN0NiqPsXVEUeY28XkyKwCRO3gp4P/OKTQaqOO5+U/31uP+6q3cmKtRyeAZPPwcbxhZB0x946z5no+B0O5L8fztt7+JVCUzVSWDHKUKAg7GDmlVrAYjeM4eef6O13i6iQDFauWkSDDq71NXjv57ozwileyExZk/ATlxMQeU4qCZRU6iVaQNhuKvh3Y7Qicl8qfMyFpnmmjp8u0XMAXQxeHUoG/g0QTlV658cwlMKbfHufker0+ciOkU9RyadUXgogTQE79AS+hFIWIQViA2LG58xdPjw6tzeB7nuiPM83A6sxwzCyr2pJr7YD3VwYQyeH3dd+E38dnYcLngGWqxhBnHquu1Qq9Ejz/sYzzq0nTIb5tLipDUB9q1e6Edo54fsuMiR9O7H3Rf6gHzXeUmf4QcjTR1PDbAEi0ioJPEVzo7XCZKxmIHpnCYhgs+vSFbPc7sC0bmu7eYQG8bhrW1ycFp7IuCK2+08a5p/v07YsmPXZmGjhIsLPu8yZe24R24EbGRZGioWKHk2Wg7isBm+8dAnjG8kS55odU0jvCZ9O1RuHgJb1vU+O/VIbce3j7TyQEB6dFpnhHbOEvr3yd1BJm0lPCAZCmAGp9DiYh5/npmY4iYOcclEOAWwbKYC4PdYvg1DGO96cLA1ZuLRSUnWwngZfR3Hikl67Sndb8gndByD3n9/DWsIfLkTxyyt6ixNo69mWGAVR1bOPxcqw6gxobGKIqUtvcJtAV7GQounK9tO+c3akyEST6dVR9iPbos0ZIgd0AsGgBhkng7/fG8zXqlKJZlVrgrr7JaCGk9sA0wWGo9bLzTLnRkF67Bgxn/LZHO9lZeAFfw7/TcRkLurWVXtX3I0SSFxRk8MsCkWrPogTWxXTZUAHPC1BlInOvuXy5z2w+qeB5NQG87NP88K7Oce5iDZb5n5Xo1jYqEvKb6yXCLeLoK0qc8EXeS9T/e7BjWj9E90C2XnFSfCIQNka1CLM/MKZHvYK99dlW2xWcJrlkqs75/c2eZTnDSusxwy4rwuZXQtdpcXNOojRqXnQp92e0MO8mfzFzjhJw4nrbq+5KlY7tJRT+t/58actQMDwgshjHg3bOcWzd8alBFIlmpBck7oZtu/VL6g/Yu3uGvsjly9Ww+V6nDpkjUE52XsYIgnMnoHR9TAFCGUSrO6wZbkAg4Amgmp2//Gdcjs9wMK7In1Xow8faTphvupX/FR+VM3g5YIoCpOsSRyV9w7SnM/UhthJy/58fOhr+qrYDEJ3a5D6+1EAAo4NN0f/JzrRlsvJ5KjI09BLKPmk0+sb8V7lCVzXLSJMvXHyfNpdPeK/hjM1UxLOajStzno60rIRjF/eAzJ5WivbNfYjDzlRwACmKpiKK8Hxanh4lH+IfLVPdZEbibNdVHiQO5gMad9SoIq0yHE+MgNA0mj6xcgUaLEbAPDEX8e80oWYoPULcfsTMYWPvGZYCku3ZnHwBQov0IwC7KAODqS3sPFSXsok+Hp96i4HsC2hCuv1SJfMPYW7jQ1glWw0/Ff/r5xoKPkdzN8D6k3xHEFWL4/H/frNcD694nz+y5b0j0PDctKIf6Z/vXImHH+ez/iHmeWJhaGAJGFsJpG79K27S04zn+WSxeYX7vmkoGSmsd2oFgrz+kX5QL63vwNX8HkeYVzkqaX36NxphTa94BEkedCiEnYapcLPvmjvOez23UjxCUL5uh3C8cX1OaAHwgB6Lm5Sx/Xj50DEfi6GV+h+0UlNXTSZzWZ2BdqZFHeELSg4pflwh58Q7Rzh6Kb7ex5JBfaRkBLCNX"), c => c.charCodeAt(0));

    let _execDecoder = null;
    let lastResult = "";

    async function decryptAlgorithm(pass) {
      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          enc.encode(pass),
          "PBKDF2",
          false,
          ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: _SALT,
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: _IV },
          key,
          _CIPHER
        );

        const codeStr = new TextDecoder().decode(decrypted);
        return new Function("str", codeStr);
      } catch (e) {
        return null;
      }
    }

    async function checkAuth() {
      const input = document.getElementById("secretCodeInput").value.trim();
      const errorEl = document.getElementById("authError");

      const decoderFn = await decryptAlgorithm(input);

      if (decoderFn) {
        _execDecoder = decoderFn;
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("decoderTool").style.display = "block";
        errorEl.style.display = "none";
        document.getElementById("inputString").focus();
      } else {
        errorEl.style.display = "block";
        document.getElementById("secretCodeInput").select();
      }
    }

    function lockAgain() {
      _execDecoder = null;
      document.getElementById("decoderTool").style.display = "none";
      document.getElementById("lockScreen").style.display = "block";
      document.getElementById("secretCodeInput").value = "";
      document.getElementById("secretCodeInput").focus();
    }

    function calculateCode() {
      const outputEl = document.getElementById("outputBox");
      const copyBtn = document.getElementById("copyBtn");
      const inputVal = document.getElementById("inputString").value.trim();

      if (!_execDecoder) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-triangle-exclamation"></i> Session verrouillée.</span>';
        return;
      }

      if (inputVal.length < 8) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> La chaîne doit comporter au moins 8 caractères.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      const res = _execDecoder(inputVal);

      if (!res) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> Format de chaîne invalide.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      lastResult = res;
      outputEl.innerHTML = `
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; display: block; margin-bottom: 4px;">Code Calculé</span>
        <div class="result-value" style="font-size: 1.8rem;">Code is : ${lastResult}</div>
      `;
      outputEl.classList.add("has-result");
      copyBtn.style.display = "inline-flex";
    }

    function copyResult() {
      if (lastResult) {
        navigator.clipboard.writeText(lastResult).then(() => {
          alert("Code copié : " + lastResult);
        });
      }
    }

    document.getElementById("inputString")?.addEventListener("keypress", (e) => {
      if (e.key === "Enter") calculateCode();
    });
  </script>

</body>
</html>
