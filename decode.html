<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Sécurisé | Outil Décodeur MS-PHARM</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Base Styling -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.12) 0%, var(--bg-main) 70%);
      padding: 24px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-lock-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 20px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.2);
    }

    [data-theme="dark"] .auth-lock-icon {
      background: rgba(2, 132, 199, 0.2);
      color: #38bdf8;
    }

    .auth-input-group {
      margin: 24px 0 16px;
      position: relative;
    }

    .auth-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-card-subtle);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: all var(--transition-fast);
    }

    .auth-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }

    /* Decoder Tool Interface (Hidden by default) */
    #decoderTool {
      display: none;
      width: 100%;
      max-width: 520px;
    }

    .decoder-output-box {
      background: var(--bg-card-subtle);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px 18px;
      text-align: center;
      margin-top: 20px;
      transition: all var(--transition-fast);
    }

    .decoder-output-box.has-result {
      background: rgba(16, 185, 129, 0.08);
      border: 2px solid var(--accent);
    }

    .result-placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .result-value {
      font-family: monospace;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 3px;
    }

    .copy-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
      margin-top: 10px;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: white;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 20px;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .back-home:hover {
      color: var(--primary);
    }

    /* Bottom Toast Notification Popup */
    .toast-bottom-popup {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2), 0 4px 10px rgba(0, 0, 0, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 99999;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-bottom-popup.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast-bottom-popup i {
      color: var(--accent);
      font-size: 1.25rem;
    }
  </style>
</head>

<body>

  <!-- ========================================================================
       Password Protection Screen
       ======================================================================== -->
  <div id="lockScreen" class="auth-card">
    <div class="auth-lock-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Accès Restreint</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">
      Veuillez entrer le code d'accès administrateur pour déverrouiller l'outil.
    </p>

    <form onsubmit="event.preventDefault(); checkAuth();">
      <div class="auth-input-group">
        <input type="password" id="secretCodeInput" class="auth-input" placeholder="••••••••" autofocus autocomplete="current-password" />
        <div id="authError" class="error-msg">
          <i class="fa-solid fa-circle-exclamation"></i> Code secret incorrect.
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-key"></i> Déverrouiller l'accès
      </button>
    </form>

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Retour au site principal
    </a>
  </div>

  <!-- ========================================================================
       Unlocked Decoder Tool
       ======================================================================== -->
  <div id="decoderTool">
    <div class="auth-card" style="text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="auth-lock-icon" style="margin: 0; width: 46px; height: 46px; font-size: 1.2rem; background: var(--accent-light); color: var(--accent);">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h2 style="font-size: 1.3rem;">Outil Décodeur</h2>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Moussaoui Services Informatique</span>
          </div>
        </div>
        <button onclick="lockAgain()" class="btn btn-outline btn-sm" title="Verrouiller">
          <i class="fa-solid fa-lock"></i> Verrouiller
        </button>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="inputString" class="form-label" style="margin-bottom: 8px; display: block; font-weight: 700;">
          <i class="fa-solid fa-barcode"></i> Chaîne de référence :
        </label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="inputString" class="auth-input" style="text-align: left; text-transform: uppercase; font-family: monospace; font-size: 1.1rem; font-weight: bold; flex: 1;" placeholder="Ex: PHARM123456" maxlength="24" />
          <button onclick="calculateCode()" class="btn btn-primary">
            <i class="fa-solid fa-calculator"></i> Afficher
          </button>
        </div>
      </div>

      <div class="decoder-output-box" id="outputBox" style="margin-bottom: 20px;">
        <div class="result-placeholder">
          Entrez la chaîne et cliquez sur <strong>Afficher</strong>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-home" style="margin: 0;">
          <i class="fa-solid fa-house"></i> Retour à l'accueil
        </a>
        <button id="copyBtn" class="copy-btn" style="display: none;" onclick="copyResult()">
          <i class="fa-regular fa-copy"></i> Copier le code
        </button>
      </div>
    </div>
  </div>

  <script>
    // Empreinte chiffrée SHA-256 du code d'accès
    const AUTH_HASH = "7f1d49243ee662770bbdff7da2cec54eb382cd9d76dfa7b049a620ec457db57b";

    // Algorithme de décodage chiffré (déverrouillé uniquement via le code d'accès)
    const ENCRYPTED_DECODER = "D99eTW+aarIRdWHZpcMXEcJPhf8wvmNHpV76tXsjnVHaisxV7CsRlieTHS2I1Jg9+FtmYe8nn2YoRDNlFAB4cGc3t8E0NRygxpIqCdmrjkYnRkiC7lvgPmmQ09JEIghN9g4zkWpd2yjxBwyIrGTPhKAMHQSzKGwTu8xvAFjr4NVAiG49OgFadhzb1WJnnof6xeUZkS94jl/2+Na8Lh3J7yCd6gOx28abXKWxZD9327oTPmaq6cL4liwCEMmhIcmexpFWQfkiNN9mB1iPX3/HnW9ZOpL+91W1FgBQEcXGuBoRnf29oS2psPnD48MeKO+d+N21XTlodFaaF0urZC9H4UMaHuLQ+IE8z9Gy1dnwdyGZZPZKUb/NCkSbDZ+eIQyEph+USnmUsS2SAwPGRHnlK8sXt6qqE0xQEYxOvxuuAQ==";

    function sha256(str) {
      function rightRotate(n, b) { return (n >>> b) | (n << (32 - b)); }
      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];
      let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      
      const msg = unescape(encodeURIComponent(str));
      const msgLen = msg.length;
      const words = [];
      for (let i = 0; i < msgLen; i++) {
        words[i >> 2] |= (msg.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
      }
      words[msgLen >> 2] |= 0x80 << (24 - (msgLen % 4) * 8);
      
      const totalWords = (((msgLen + 8) >> 6) + 1) * 16;
      while (words.length < totalWords) words.push(0);
      words[totalWords - 1] = msgLen * 8;

      for (let i = 0; i < totalWords; i += 16) {
        const W = new Array(64);
        for (let t = 0; t < 16; t++) W[t] = words[i + t] | 0;
        for (let t = 16; t < 64; t++) {
          const s0 = rightRotate(W[t - 15], 7) ^ rightRotate(W[t - 15], 18) ^ (W[t - 15] >>> 3);
          const s1 = rightRotate(W[t - 2], 17) ^ rightRotate(W[t - 2], 19) ^ (W[t - 2] >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
          const ch = (e & f) ^ ((~e) & g);
          const temp1 = (h + S1 + ch + K[t] + W[t]) | 0;
          const S0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (S0 + maj) | 0;

          h = g;
          g = f;
          f = e;
          e = (d + temp1) | 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) | 0;
        }
        H[0] = (H[0] + a) | 0;
        H[1] = (H[1] + b) | 0;
        H[2] = (H[2] + c) | 0;
        H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0;
        H[5] = (H[5] + f) | 0;
        H[6] = (H[6] + g) | 0;
        H[7] = (H[7] + h) | 0;
      }
      return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }

    function decryptStream(b64Str, keyPass) {
      try {
        const salt = "ms-pharm-sec-2026";
        const binStr = atob(b64Str);
        const dataBytes = [];
        for (let i = 0; i < binStr.length; i++) dataBytes.push(binStr.charCodeAt(i));
        const outBytes = [];
        let block = [];
        let blockIdx = 0;
        for (let i = 0; i < dataBytes.length; i++) {
          if (i % 32 === 0) {
            const hex = sha256(keyPass + salt + blockIdx);
            block = [];
            for (let c = 0; c < hex.length; c += 2) block.push(parseInt(hex.substr(c, 2), 16));
            blockIdx++;
          }
          outBytes.push(dataBytes[i] ^ block[i % 32]);
        }
        let str = "";
        for (let i = 0; i < outBytes.length; i++) str += String.fromCharCode(outBytes[i]);
        return decodeURIComponent(escape(str));
      } catch (e) {
        return null;
      }
    }

    let _execDecoder = null;
    let lastResult = "";

    function checkAuth() {
      const inputEl = document.getElementById("secretCodeInput");
      const rawInput = (inputEl.value || "").trim().toLowerCase();
      const errorEl = document.getElementById("authError");

      if (sha256(rawInput) === AUTH_HASH) {
        try {
          const decryptedCode = decryptStream(ENCRYPTED_DECODER, rawInput);
          if (decryptedCode) {
            _execDecoder = new Function("b", decryptedCode);
            document.getElementById("lockScreen").style.display = "none";
            document.getElementById("decoderTool").style.display = "block";
            errorEl.style.display = "none";
            const inputStringEl = document.getElementById("inputString");
            if (inputStringEl) inputStringEl.focus();
            return;
          }
        } catch (e) {}
      }

      errorEl.style.display = "block";
      inputEl.select();
    }

    function lockAgain() {
      _execDecoder = null;
      document.getElementById("decoderTool").style.display = "none";
      document.getElementById("lockScreen").style.display = "block";
      const secretInput = document.getElementById("secretCodeInput");
      secretInput.value = "";
      secretInput.focus();
    }

    function calculateCode() {
      const outputEl = document.getElementById("outputBox");
      const copyBtn = document.getElementById("copyBtn");
      const inputVal = document.getElementById("inputString").value.trim();

      if (!_execDecoder) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-triangle-exclamation"></i> Session verrouillée.</span>';
        return;
      }

      if (inputVal.length < 8) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> La chaîne doit comporter au moins 8 caractères.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      const res = _execDecoder(inputVal);

      if (!res) {
        outputEl.innerHTML = '<span style="color: #ef4444; font-size: 0.9rem;"><i class="fa-solid fa-circle-exclamation"></i> Format de chaîne invalide.</span>';
        outputEl.classList.remove("has-result");
        copyBtn.style.display = "none";
        return;
      }

      lastResult = res;
      outputEl.innerHTML = `
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; display: block; margin-bottom: 4px;">Code Calculé</span>
        <div class="result-value" style="font-size: 1.8rem;">Code is : ${lastResult}</div>
      `;
      outputEl.classList.add("has-result");
      copyBtn.style.display = "inline-flex";
    }

    function showBottomToast(msg) {
      let toast = document.getElementById("bottomToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "bottomToast";
        toast.className = "toast-bottom-popup";
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
      toast.classList.add("show");

      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function fallbackCopy(text, callback) {
      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      tempInput.style.position = "fixed";
      tempInput.style.left = "-9999px";
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        if (callback) callback();
      } catch (err) {
        console.error("Erreur copie :", err);
      }
      document.body.removeChild(tempInput);
    }

    function copyResult() {
      if (!lastResult) return;

      const onCopied = () => {
        showBottomToast(`Code copié : <strong>${lastResult}</strong>`);
        const copyBtn = document.getElementById("copyBtn");
        if (copyBtn) {
          const origHtml = copyBtn.innerHTML;
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copié !';
          copyBtn.style.background = 'var(--accent)';
          copyBtn.style.color = '#fff';
          copyBtn.style.borderColor = 'var(--accent)';
          setTimeout(() => {
            copyBtn.innerHTML = origHtml;
            copyBtn.style.background = '';
            copyBtn.style.color = '';
            copyBtn.style.borderColor = '';
          }, 2000);
        }
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(lastResult).then(onCopied).catch(() => {
          fallbackCopy(lastResult, onCopied);
        });
      } else {
        fallbackCopy(lastResult, onCopied);
      }
    }

    document.getElementById("inputString")?.addEventListener("keypress", (e) => {
      if (e.key === "Enter") calculateCode();
    });
  </script>

</body>
</html>
